<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Express - क्रिकेट क्विज़</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .quiz-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #ff9800;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .tagline {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            font-weight: bold;
        }
        h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.4;
        }
        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background-color: #f8f9fa;
            color: #333;
            border: 2px solid #ddd;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
            text-align: left;
        }
        .btn:hover { background-color: #e2e6ea; }
        .correct { background-color: #28a745 !important; color: white !important; border-color: #28a745 !important; }
        .wrong { background-color: #dc3545 !important; color: white !important; border-color: #dc3545 !important; }
        #next-btn {
            margin-top: 20px;
            background-color: #ff9800;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        #next-btn:hover { background-color: #e68a00; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1>🏏 Quiz Express</h1>
        <div class="tagline">क्रिकेट स्पेशल - 10 धमाकेदार सवाल</div>
        <h2 id="question">सवाल लोड हो रहा है...</h2>
        <div id="answer-buttons" class="btn-grid">
            <!-- ऑप्शंस यहाँ दिखेंगे -->
        </div>
        <button id="next-btn" class="btn">अगला सवाल (Next)</button>
    </div>

    <script>
        const questions = [
            {
                question: "1. क्रिकेट में 'कैप्टन कूल' (Captain Cool) के नाम से किसे जाना जाता है?",
                answers: [
                    { text: "विराट कोहली", correct: false },
                    { text: "एम. एस. धोनी (MS Dhoni)", correct: true },
                    { text: "रोहित शर्मा", correct: false },
                    { text: "सचिन तेंदुलकर", correct: false }
                ]
            },
            {
                question: "2. अंतर्राष्ट्रीय क्रिकेट में 100 शतक बनाने वाले एकमात्र खिलाड़ी कौन हैं?",
                answers: [
                    { text: "सचिन तेंदुलकर", correct: true },
                    { text: "विराट कोहली", correct: false },
                    { text: "रिकी पोंटिंग", correct: false },
                    { text: "ब्रायन लारा", correct: false }
                ]
            },
            {
                question: "3. भारत ने अपना पहला वनडे वर्ल्ड कप किस वर्ष जीता था?",
                answers: [
                    { text: "2011", correct: false },
                    { text: "1983", correct: true },
                    { text: "1992", correct: false },
                    { text: "2007", correct: false }
                ]
            },
            {
                question: "4. आईपीएल (IPL) इतिहास में सबसे ज्यादा रन बनाने वाले बल्लेबाज कौन हैं?",
                answers: [
                    { text: "शिखर धवन", correct: false },
                    { text: "डेविड वॉर्नर", correct: false },
                    { text: "विराट कोहली", correct: true },
                    { text: "रोहित शर्मा", correct: false }
                ]
            },
            {
                question: "5. 'हिटमैन' (Hitman) के नाम से किस भारतीय क्रिकेटर को जाना जाता है?",
                answers: [
                    { text: "सुरेश रैना", correct: false },
                    { text: "के.एल. राहुल", correct: false },
                    { text: "हार्दिक पांड्या", correct: false },
                    { text: "रोहित शर्मा", correct: true }
                ]
            },
            {
                question: "6. टी20 (T20) अंतर्राष्ट्रीय मैच के एक ओवर में 6 छक्के लगाने वाले पहले भारतीय कौन थे?",
                answers: [
                    { text: "युवराज सिंह", correct: true },
                    { text: "वीरेंद्र सहवाग", correct: false },
                    { text: "एम. एस. धोनी", correct: false },
                    { text: "सूर्यकुमार यादव", correct: false }
                ]
            },
            {
                question: "7. चेन्नई सुपर किंग्स (CSK) ने अब तक कुल कितनी बार IPL ट्रॉफी जीती है?",
                answers: [
                    { text: "3 बार", correct: false },
                    { text: "5 बार", correct: true },
                    { text: "4 बार", correct: false },
                    { text: "2 बार", correct: false }
                ]
            },
            {
                question: "8. क्रिकेट का 'मक्का' (Cricket Capital) किस स्टेडियम को कहा जाता है?",
                answers: [
                    { text: "ईडन गार्डन्स (कोलकाता)", correct: false },
                    { text: "लॉर्ड्स (इंग्लैंड)", correct: true },
                    { text: "एमसीजी (ऑस्ट्रेलिया)", correct: false },
                    { text: "वानखेड़े (मुंबई)", correct: false }
                ]
            },
            {
                question: "9. पहला एकदिवसीय (ODI) क्रिकेट वर्ल्ड कप किस देश ने जीता था?",
                answers: [
                    { text: "ऑस्ट्रेलिया", correct: false },
                    { text: "भारत", correct: false },
                    { text: "वेस्टइंडीज", correct: true },
                    { text: "इंग्लैंड", correct: false }
                ]
            },
            {
                question: "10. टी20 वर्ल्ड कप 2024 का खिताब किस देश ने जीता?",
                answers: [
                    { text: "दक्षिण अफ्रीका", correct: false },
                    { text: "भारत", correct: true },
                    { text: "ऑस्ट्रेलिया", correct: false },
                    { text: "इंग्लैंड", correct: false }
                ]
            }
        ];

        const questionElement = document.getElementById("question");
        const answerButtonsElement = document.getElementById("answer-buttons");
        const nextButton = document.getElementById("next-btn");

        let currentQuestionIndex = 0;
        let score = 0;

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            nextButton.innerText = "अगला सवाल";
            showQuestion();
        }

        function showQuestion() {
            resetState();
            let currentQuestion = questions[currentQuestionIndex];
            questionElement.innerText = currentQuestion.question;

            currentQuestion.answers.forEach(answer => {
                const button = document.createElement("button");
                button.innerText = answer.text;
                button.classList.add("btn");
                if (answer.correct) {
                    button.dataset.correct = answer.correct;
                }
                button.addEventListener("click", selectAnswer);
                answerButtonsElement.appendChild(button);
            });
        }

        function resetState() {
            nextButton.style.display = "none";
            while (answerButtonsElement.firstChild) {
                answerButtonsElement.removeChild(answerButtonsElement.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedBtn = e.target;
            const isCorrect = selectedBtn.dataset.correct === "true";
            
            if (isCorrect) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
            }

            Array.from(answerButtonsElement.children).forEach(button => {
                if (button.dataset.correct === "true") {
                    button.classList.add("correct");
                }
                button.disabled = true;
            });
            nextButton.style.display = "block";
        }

        function showScore() {
            resetState();
            let performanceMsg = "";
            if(score === 10) {
                performanceMsg = "🏆 कमाल कर दिया! आप असली क्रिकेट मास्टर हैं!";
            } else if(score >= 7) {
                performanceMsg = "👏 बहुत बढ़िया प्रदर्शन!";
            } else {
                performanceMsg = "👍 अच्छा प्रयास! फिर से कोशिश करें!";
            }
            questionElement.innerText = `🎉 क्विज़ समाप्त!\nआपका स्कोर: ${score} / ${questions.length}\n\n${performanceMsg}`;
            nextButton.innerText = "फिर से खेलें (Restart)";
            nextButton.style.display = "block";
        }

        function handleNextButton() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showScore();
            }
        }

        nextButton.addEventListener("click", () => {
            if (currentQuestionIndex < questions.length) {
                handleNextButton();
            } else {
                startQuiz();
            }
        });

        startQuiz();
    </script>
</body>
</html>
