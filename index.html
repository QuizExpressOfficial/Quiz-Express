<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Express - Ultimate Cricket Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 1. लॉगइन / वेलकम पेज का डिज़ाइन */
        #login-section {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
        }

        #login-section h1 {
            font-size: 30px;
            color: #00ffcc;
            margin-bottom: 15px;
        }

        #login-section p {
            font-size: 16px;
            color: #e0e0e0;
            margin-bottom: 25px;
        }

        .input-box {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .input-box::placeholder {
            color: #ccc;
        }

        .start-btn {
            background: linear-gradient(135deg, #ff4b12, #ffc107);
            color: #000;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(255, 75, 18, 0.5);
            width: 100%;
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.02);
        }

        /* 2. क्विज़ सेक्शन (शुरुआत में छुपा रहेगा) */
        #quiz-section {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
        }

        .user-greeting {
            font-size: 14px;
            color: #00ffcc;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .question-box {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffc107;
            font-weight: bold;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 18px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .option-btn:hover {
            background: rgba(0, 255, 204, 0.3);
            border-color: #00ffcc;
        }

        #score-display {
            font-size: 18px;
            text-align: center;
            color: #00ffcc;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- लॉगइन / वेलकम स्क्रीन -->
    <div id="login-section">
        <h1>All Cricket Fans Welcome</h1>
        <p>अपनी क्रिकेट नॉलेज टेस्ट करने के लिए अपना नाम दर्ज करें:</p>
        <input type="text" id="username" class="input-box" placeholder="अपना नाम लिखें...">
        <button class="start-btn" onclick="startQuiz()">Join Quiz Now</button>
    </div>

    <!-- क्विज़ इंटरफेस (10 सवाल) -->
    <div id="quiz-section">
        <div class="user-greeting" id="greeting-text"></div>
        <div class="question-box" id="question-text">सवाल लोड हो रहा है...</div>
        <div id="options-container">
            <button class="option-btn" onclick="checkAnswer(0)" id="opt0"></button>
            <button class="option-btn" onclick="checkAnswer(1)" id="opt1"></button>
            <button class="option-btn" onclick="checkAnswer(2)" id="opt2"></button>
            <button class="option-btn" onclick="checkAnswer(3)" id="opt3"></button>
        </div>
        <div id="score-display"></div>
    </div>

    <script>
        // 10 क्रिकेट के सवाल और उनके सही जवाब (0 से 3 इंडेक्स)
        const quizData = [
            {
                question: "1. क्रिकेट का मक्का किस मैदान को कहा जाता है?",
                options: ["मेलबर्न क्रिकेट ग्राउंड", "लॉर्ड्स (लندن)", "ईडन गार्डन्स", "वानखेड़े स्टेडियम"],
                answer: 1
            },
            {
                question: "2. अंतरराष्ट्रीय क्रिकेट में सबसे तेज 100 शतक किसने बनाए हैं?",
                options: ["विराट कोहली", "सचिन तेंदुलकर", "रिकी पोंटिंग", "क्रिस गेल"],
                answer: 1
            },
            {
                question: "3. भारत ने अपना पहला क्रिकेट विश्व कप किस वर्ष जीता था?",
                options: ["1983", "1987", "2011", "1975"],
                answer: 0
            },
            {
                question: "4. आईपीएल (IPL) इतिहास की सबसे सफल टीम कौन सी है?",
                options: ["रॉयल चैलेंजर्स बेंगलुरु", "मुंबई इंडियंस और चेन्नई सुपर किंग्स", "कोलकाता नाइट राइडर्स", "सनराइजर्स हैदराबाद"],
                answer: 1
            },
            {
                question: "5. 'क्रिकेट के भगवान' के रूप में किसे जाना जाता है?",
                options: ["महेंद्र सिंह धोनी", "विराट कोहली", "सचिन तेंदुलकर", "रोहित शर्मा"],
                answer: 2
            },
            {
                question: "6. एक दिवसीय अंतरराष्ट्रीय (ODI) मैच में अधिकतम स्कोर बनाने वाले खिलाड़ी कौन हैं?",
                options: ["रोहित शर्मा", "क्रिस गेल", "मार्पट गुप्टिल", "वीरेंद्र सहवाग"],
                answer: 0
            },
            {
                question: "7. टी20 विश्व कप 2007 का फाइनल मुकाबला किस देश के खिलाफ था?",
                options: ["ऑस्ट्रेलिया", "पाकिस्तान", "श्रीलंका", "इंग्लैंड"],
                answer: 1
            },
            {
                question: "8. क्रिकेट पिच की लंबाई कितनी होती है?",
                options: ["20 गज", "22 गज", "24 गज", "18 गज"],
                answer: 1
            },
            {
                question: "9. अंतरराष्ट्रीय क्रिकेट परिषद (ICC) का मुख्यालय कहाँ स्थित है?",
                options: ["लंदन, इंग्लैंड", "दुबई, संयुक्त अरब अमीरात", "मेलबर्न, ऑस्ट्रेलिया", "नई दिल्ली, भारत"],
                answer: 1
            },
            {
                question: "10. आईपीएल में 'ऑरेंज कैप' किस लिए दी जाती है?",
                options: ["सर्वाधिक विकेट लेने वाले को", "सर्वाधिक रन बनाने वाले को", "सर्वश्रेष्ठ फील्डर को", "बेस्ट फेयरप्ले टीम को"],
                answer: 1
            }
        ];

        let currentQuiz = 0;
        let score = 0;
        let playerName = "";

        function startQuiz() {
            const nameInput = document.getElementById('username').value.trim();
            if (nameInput === "") {
                alert("कृपया पहले अपना नाम दर्ज करें!");
                return;
            }
            playerName = nameInput;

            // लॉगिन स्क्रीन छुपाओ और क्विज़ दिखाओ
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            
            document.getElementById('greeting-text').innerText = "खिलाड़ी: " + playerName;
            loadQuestion();
        }

        function loadQuestion() {
            let currentQ = quizData[currentQuiz];
            document.getElementById('question-text').innerText = currentQ.question;
            document.getElementById('opt0').innerText = currentQ.options[0];
            document.getElementById('opt1').innerText = currentQ.options[1];
            document.getElementById('opt2').innerText = currentQ.options[2];
            document.getElementById('opt3').innerText = currentQ.options[3];
        }

        function checkAnswer(selected) {
            if (selected === quizData[currentQuiz].answer) {
                score++;
            }

            currentQuiz++;
            if (currentQuiz < quizData.length) {
                loadQuestion();
            } else {
                // क्विज़ खत्म होने पर स्कोर दिखाना
                document.getElementById('quiz-section').innerHTML = `
                    <h2 style="color: #00ffcc; text-align: center; margin-bottom: 20px;">क्विज़ समाप्त हुआ! 🎉</h2>
                    <p style="text-align: center; font-size: 20px; margin-bottom: 10px;">बधाई हो, ${playerName}!</p>
                    <p style="text-align: center; font-size: 18px; color: #ffc107;">आपका स्कोर: ${score} / ${quizData.length}</p>
                    <button class="start-btn" style="margin-top: 20px;" onclick="location.reload()">दोबारा खेलें</button>
                `;
            }
        }
    </script>

</body>
</html>
