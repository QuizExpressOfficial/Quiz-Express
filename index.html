<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Express</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        body { 
            /* शानदार बैकग्राउंड ग्रेडिएंट */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #333; 
            padding: 20px; 
        }
        
        /* Glassmorphism इफ़ेक्ट */
        .glass-container { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); 
            border-radius: 20px; 
            padding: 40px; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); 
            text-align: center; 
        }
        
        /* आपकी प्रोफाइल फोटो की स्टाइलिंग */
        .profile-pic { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #f39c12; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        /* टाइटल स्टाइल */
        .cricket-title { 
            font-size: 32px; 
            font-weight: bold; 
            color: #2c3e50; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 25px; 
        }
        
        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 20px; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            font-size: 16px; 
            outline: none; 
            transition: 0.3s; 
        }
        input:focus { border-color: #3498db; }
        
        button { 
            background: #3498db; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 10px; 
            font-size: 18px; 
            cursor: pointer; 
            transition: 0.3s; 
            width: 100%; 
            font-weight: bold; 
            margin-bottom: 12px; 
        }
        button:hover { background: #2980b9; }
        
        /* क्विज के ऑप्शंस बटन की स्टाइल */
        .quiz-btn { 
            background: #f1f2f6; 
            color: #2f3542; 
            border: 2px solid #dfe4ea; 
            font-size: 16px;
        }
        .quiz-btn:hover { background: #dfe4ea; }
        
        /* सही और गलत जवाब के कलर्स */
        .correct { background: #2ecc71 !important; color: white !important; border-color: #2ecc71 !important; }
        .incorrect { background: #e74c3c !important; color: white !important; border-color: #e74c3c !important; }
        
        /* सेक्शंस को छिपाने के लिए */
        #quiz-section, #result-section { display: none; }
        
        .question-text { font-size: 20px; margin-bottom: 25px; font-weight: 600; text-align: left; line-height: 1.4; }
        .score-text { font-size: 28px; font-weight: bold; color: #2ecc71; margin: 20px 0; }
        .thanks-text { font-size: 24px; color: #34495e; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- लॉगिन स्क्रीन -->
    <div class="glass-container" id="login-section">
        <!-- यहाँ आपकी फोटो ऐड कर दी गई है -->
        <img src="59616.png" alt="Tapas Profile" class="profile-pic">
        
        <div class="cricket-title">🏏 Cricket ⚾<br>Quiz Express</div>
        
        <input type="text" id="username" placeholder="अपना नाम दर्ज करें (Enter your name)">
        <button onclick="startQuiz()">Join Quiz</button>
    </div>

    <!-- क्विज स्क्रीन -->
    <div class="glass-container" id="quiz-section">
        <h2 style="text-align: left; margin-bottom: 15px; color: #7f8c8d; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
            Question <span id="q-num">1</span>/10
        </h2>
        <div class="question-text" id="question">Question goes here</div>
        <div id="options">
            <!-- जवाब के बटन यहाँ आएँगे -->
        </div>
    </div>

    <!-- रिजल्ट स्क्रीन -->
    <div class="glass-container" id="result-section">
        <div class="thanks-text">Thanks for Joining, <span id="user-display"></span>! 🎉</div>
        <div class="score-text">Rating: <span id="score"></span>/10</div>
        <p style="margin-bottom: 25px; color: #7f8c8d; font-size: 18px;">Well played! Hope you enjoyed the cricket quiz.</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script>
        // 10 मजेदार क्रिकेट सवाल 
        const quizData = [
            { q: "Who is famously known as 'Captain Cool'?", options: ["Virat Kohli", "Rohit Sharma", "MS Dhoni", "Sachin Tendulkar"], ans: 2 },
            { q: "What is Virat Kohli's iconic jersey number?", options: ["18", "7", "45", "10"], ans: 0 },
            { q: "Which IPL team has MS Dhoni captained since 2008?", options: ["Mumbai Indians", "Chennai Super Kings", "RCB", "Kolkata Knight Riders"], ans: 1 },
            { q: "Who holds the record for the most runs in a single IPL season?", options: ["Chris Gayle", "David Warner", "Shubman Gill", "Virat Kohli"], ans: 3 },
            { q: "Which stadium is the home ground of Chennai Super Kings (CSK)?", options: ["Wankhede Stadium", "Eden Gardens", "M. A. Chidambaram (Chepauk)", "Chinnaswamy Stadium"], ans: 2 },
            { q: "What is the famous nickname of Virat Kohli?", options: ["Chiku", "Mahi", "Hitman", "Gabbbar"], ans: 0 },
            { q: "How many IPL trophies has MS Dhoni won as captain?", options: ["3", "4", "5", "6"], ans: 2 },
            { q: "Which iconic shot is MS Dhoni known for inventing to hit yorkers?", options: ["Upper Cut", "Helicopter Shot", "Switch Hit", "Dilscoop"], ans: 1 },
            { q: "Who is the all-time highest run-scorer in IPL history?", options: ["Shikhar Dhawan", "David Warner", "Rohit Sharma", "Virat Kohli"], ans: 3 },
            { q: "Which international team did MS Dhoni lead to three major ICC trophies?", options: ["Australia", "England", "India", "West Indies"], ans: 2 }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let userName = "";

        function startQuiz() {
            const nameInput = document.getElementById("username").value;
            if (nameInput.trim() === "") {
                alert("Please enter your name first!");
                return;
            }
            userName = nameInput;
            document.getElementById("login-section").style.display = "none";
            document.getElementById("quiz-section").style.display = "block";
            loadQuestion();
        }

        function loadQuestion() {
            const qData = quizData[currentQuestionIndex];
            document.getElementById("q-num").innerText = currentQuestionIndex + 1;
            document.getElementById("question").innerText = qData.q;
            
            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "quiz-btn";
                btn.onclick = () => checkAnswer(btn, index);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, selectedIndex) {
            const correctIndex = quizData[currentQuestionIndex].ans;
            const allButtons = document.getElementById("options").children;
            
            // बटन को लॉक करना ताकि यूज़र दो बार क्लिक न कर सके
            for (let btn of allButtons) {
                btn.disabled = true;
            }

            if (selectedIndex === correctIndex) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("incorrect");
                // अगर गलत दिया, तो सही वाले को ग्रीन कर दो
                allButtons[correctIndex].classList.add("correct");
            }

            // 1.5 सेकंड (1500 ms) के बाद अगला सवाल
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1500);
        }

        function showResult() {
            document.getElementById("quiz-section").style.display = "none";
            document.getElementById("result-section").style.display = "block";
            document.getElementById("user-display").innerText = userName;
            document.getElementById("score").innerText = score;
        }
    </script>
</body>
</html>
