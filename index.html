<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Fans Quiz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* फेज 1 स्टाइल */
        #phase1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 38px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }

        input {
            width: 90%;
            max-width: 320px;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 18px;
            margin-bottom: 25px;
            text-align: center;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .blink-btn {
            background: white;
            color: #ff5722;
            font-size: 22px;
            font-weight: bold;
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            animation: blinking 1.2s infinite; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        @keyframes blinking {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,255,255,0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(255,255,255,1); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        }

        .footer-text {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- फेज 1: वेलकम इंटरफेस -->
    <div id="phase1">
        <img src="59616.png" alt="Profile Photo" class="profile-pic">
        <h1>Welcome to Cricket Fans</h1>
        <input type="text" id="username" placeholder="अपना नाम दर्ज करें...">
        <button class="blink-btn" onclick="startQuiz()">Join Quiz Now</button>
        <div class="footer-text">Powered by Tapas Tanti</div>
    </div>

    <!-- फेज 2: क्विज़ इंटरफेस -->
    <div id="phase2" style="display: none; width: 100%; max-width: 500px;">
        <div style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); color: #333; text-align: left;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
                <span id="q-counter" style="font-size: 16px; font-weight: bold; color: #ff5722;">Question 1/10</span>
                <span id="timer" style="font-size: 16px; font-weight: bold; color: #e74c3c; background: #fdf2f2; padding: 5px 12px; border-radius: 20px;">⏱️ 05:00</span>
            </div>

            <div id="question-text" style="font-size: 20px; font-weight: bold; color: #2c3e50; margin-bottom: 25px; line-height: 1.4;">
                Question text...
            </div>

            <div id="options-container" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
    </div>

    <!-- फेज 3: क्लोजिंग, स्कोर और रेटिंग इंटरफेस -->
    <div id="phase3" style="display: none; width: 100%; max-width: 500px;">
        <div style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); color: #333; text-align: center;">
            
            <h2 style="font-size: 28px; color: #ff5722; margin-bottom: 10px;">Thank You for Joining Us! 🎉</h2>
            <p style="font-size: 16px; color: #555; margin-bottom: 20px;">Aasha karta hoon aapko cricket quiz mein maza aaya hoga!</p>

            <div id="final-score" style="font-size: 22px; font-weight: bold; color: #2c3e50; background: #fff3e0; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                Your Score: 0/10
            </div>

            <div style="margin-bottom: 25px;">
                <p style="font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #333;">Rate Your Experience:</p>
                <div id="star-rating" style="font-size: 35px; cursor: pointer; color: #ddd; letter-spacing: 5px;">
                    <span onclick="rateQuiz(1)">★</span>
                    <span onclick="rateQuiz(2)">★</span>
                    <span onclick="rateQuiz(3)">★</span>
                    <span onclick="rateQuiz(4)">★</span>
                    <span onclick="rateQuiz(5)">★</span>
                </div>
                <p id="rating-msg" style="font-size: 14px; color: #e67e22; margin-top: 8px; font-weight: bold;"></p>
            </div>

            <button onclick="restartQuiz()" style="background: #ff5722; color: white; font-size: 18px; font-weight: bold; padding: 14px 30px; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,87,34,0.4); width: 100%; transition: 0.3s;">
                Play Again 🔄
            </button>
        </div>
    </div>

    <script>
        const realQuizData = [
            { q: "Captain Cool ke naam se kaun jaane jaate hain?", options: ["Virat Kohli", "Rohit Sharma", "MS Dhoni", "Sachin Tendulkar"], ans: 2 },
            { q: "Virat Kohli ka iconic jersey number kitna hai?", options: ["18", "7", "45", "10"], ans: 0 },
            { q: "MS Dhoni 2008 se kis IPL team ke captain rahe hain?", options: ["Mumbai Indians", "Chennai Super Kings", "RCB", "Kolkata Knight Riders"], ans: 1 },
            { q: "IPL ke ek hi season mein sabse zyada runs banane ka record kiske paas hai?", options: ["Chris Gayle", "David Warner", "Shubman Gill", "Virat Kohli"], ans: 3 },
            { q: "Chennai Super Kings (CSK) ka home ground kaun sa stadium hai?", options: ["Wankhede Stadium", "Eden Gardens", "M. A. Chidambaram (Chepauk)", "Chinnaswamy Stadium"], ans: 2 },
            { q: "Virat Kohli ka famous nickname kya hai?", options: ["Chiku", "Mahi", "Hitman", "Gabbar"], ans: 0 },
            { q: "MS Dhoni ne captain ke taur par kitni IPL trophies jeeti hain?", options: ["3", "4", "5", "6"], ans: 2 },
            { q: "Yorker ball par 'Helicopter Shot' marne ke liye kaun famous hai?", options: ["Rohit Sharma", "MS Dhoni", "AB de Villiers", "Surya Kumar"], ans: 1 },
            { q: "IPL history mein all-time sabse zyada runs banane wala player kaun hai?", options: ["Shikhar Dhawan", "David Warner", "Rohit Sharma", "Virat Kohli"], ans: 3 },
            { q: "MS Dhoni ne apni captaincy mein India ko kitni major ICC trophies jitwayi hain?", options: ["1 Trophy", "2 Trophies", "3 Trophies", "4 Trophies"], ans: 2 }
        ];

        let currentQ = 0;
        let score = 0;
        let timerInterval;
        let timeLeft = 300; // 5 minutes

        function startQuiz() {
            const name = document.getElementById("username").value;
            if(!name.trim()) {
                alert("Please enter your name first!");
                return;
            }
            document.getElementById("phase1").style.display = "none";
            document.getElementById("phase2").style.display = "block";
            loadQuestion();
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showPhase3();
                    return;
                }
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById("timer").innerText = `⏱️ ${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }, 1000);
        }

        function loadQuestion() {
            if(currentQ >= realQuizData.length) {
                clearInterval(timerInterval);
                showPhase3();
                return;
            }
            let qData = realQuizData[currentQ];
            document.getElementById("q-counter").innerText = `Question ${currentQ + 1}/10`;
            document.getElementById("question-text").innerText = qData.q;
            
            let container = document.getElementById("options-container");
            container.innerHTML = "";
            
            qData.options.forEach((opt, idx) => {
                let btn = document.createElement("button");
                btn.innerText = opt;
                btn.style.cssText = "background: #f1f2f6; color: #2f3542; border: 2px solid #dfe4ea; padding: 14px; border-radius: 10px; font-size: 16px; cursor: pointer; text-align: left; font-weight: 600; transition: 0.3s;";
                btn.onclick = () => checkAns(btn, idx);
                container.appendChild(btn);
            });
        }

        function checkAns(selectedBtn, selectedIdx) {
            let correctIdx = realQuizData[currentQ].ans;
            let allBtns = document.getElementById("options-container").children;
            
            for(let b of allBtns) { b.disabled = true; }

            if(selectedIdx === correctIdx) {
                selectedBtn.style.background = "#2ecc71"; // Green
                selectedBtn.style.color = "white";
                selectedBtn.style.borderColor = "#2ecc71";
                score++;
            } else {
                selectedBtn.style.background = "#e74c3c"; // Red
                selectedBtn.style.color = "white";
                selectedBtn.style.borderColor = "#e74c3c";
                allBtns[correctIdx].style.background = "#2ecc71"; // Show correct in green
                allBtns[correctIdx].style.color = "white";
                allBtns[correctIdx].style.borderColor = "#2ecc71";
            }

            setTimeout(() => {
                currentQ++;
                loadQuestion();
            }, 1500);
        }

        function showPhase3() {
            document.getElementById("phase2").style.display = "none";
            document.getElementById("phase3").style.display = "block";
            document.getElementById("final-score").innerText = `Your Score: ${score} / 10`;
        }

        function rateQuiz(stars) {
            let starElements = document.getElementById("star-rating").children;
            for(let i = 0; i < starElements.length; i++) {
                if(i < stars) {
                    starElements[i].style.color = "#f1c40f"; // Gold
                } else {
                    starElements[i].style.color = "#ddd"; // Grey
                }
            }
            document.getElementById("rating-msg").innerText = `Thank you for rating us ${stars} stars! ⭐`;
        }

        function restartQuiz() {
            currentQ = 0;
            score = 0;
            timeLeft = 300;
            let starElements = document.getElementById("star-rating").children;
            for(let s of starElements) { s.style.color = "#ddd"; }
            document.getElementById("rating-msg").innerText = "";
            
            document.getElementById("phase3").style.display = "none";
            document.getElementById("phase1").style.display = "flex";
            document.getElementById("username").value = "";
        }
    </script>
</body>
</html>
